<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Все версии сайта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--accent:#8B1FC2;--soft:#F5F0FA;--ink:#1A1221;--muted:#71677B;--line:#EAE3F0;--r:22px}
@supports (corner-shape: squircle){:root{--r:34px}}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:500 16px/1.5 "Manrope",system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:18px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);corner-shape:squircle;overflow:hidden;text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 20px 40px -24px rgba(70,20,100,.35)}
.shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--soft);border-bottom:1px solid var(--line)}
.shot iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none}
.num{position:absolute;top:12px;left:12px;z-index:2;width:48px;height:48px;border-radius:16px;corner-shape:squircle;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 8px 20px -8px rgba(139,31,194,.7)}
.cur{position:absolute;top:12px;right:12px;z-index:2;background:#1F9D5F;color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
.meta{padding:16px 20px 20px;display:flex;flex-direction:column;gap:4px}
.meta b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.meta span{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Все версии сайта</h1>
  <p class="lead">По порядку, как появлялись. Нажмите на карточку, чтобы открыть версию целиком, и скажите номер.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
var V=[
 ['Первая','Бетонный фон, жёлтый акцент, план помещения, таблица WB / Ozon'],
 ['Белая с фиолетовым','Белый фон, фиолетовый акцент, квадратные блоки, возражения и цены'],
 ['Округлая','То же, но скруглённые блоки и суперэллипсы'],
 ['Редизайн с планом','Плавающее меню, план помещения с уведомлениями, плитки услуг'],
 ['Выбор ситуации','Четыре ситуации → план и цена → конструктор заявки'],
 ['Выбор ситуации + якоря','Плюс калькулятор, «Сами или со мной», гарантия, бегущая строка, эффекты'],
 ['Чат','Сайт как переписка с агентом, заявка в конце диалога'],
 ['Журнал','Длинная статья: антиква, главы, оглавление'],
 ['Кабинет','Как личный кабинет: меню слева, виджеты'],
 ['Сторис','Лента ярких карточек, листается пальцем'],
 ['Дерзкий','Огромные заголовки, цифры «0 ₽», блок болей, оффер'],
 ['Выбор ситуации + Unbounded','Версия 6 с широкими жирными заголовками'],
 ['Версия 4 в чёрном','Чёрный акцент, Wildberries фиолетовым, Ozon синим']
];
var CURRENT=13;
var g=document.getElementById('grid');
V.forEach(function(v,i){
  var n=(i+1<10?'0':'')+(i+1);
  var a=document.createElement('a');a.className='card';a.href=n+'.html';a.target='_blank';
  a.innerHTML='<div class="shot"><span class="num">'+(i+1)+'</span>'+(i+1===CURRENT?'<span class="cur">сейчас на сайте</span>':'')+'<iframe src="'+n+'.html" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="meta"><b>'+(i+1)+'. '+v[0]+'</b><span>'+v[1]+'</span></div>';
  g.appendChild(a);
});
function fit(){document.querySelectorAll('.shot').forEach(function(s){s.querySelector('iframe').style.transform='scale('+(s.clientWidth/1280)+')';});}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
